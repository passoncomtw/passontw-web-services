name: Build POS Backend Web

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/cicd-pos-backend-web.yaml'
      - 'cmd/pos-backend-web/**'
      - 'deploy/pos-backend-web/**'
      - 'k8s/**'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/pos-backend-web
  SERVICE_NAME: pos-backend-web
  NAMESPACE: passontw-services-staging

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.set-tag.outputs.image_tag }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image tag
        id: set-tag
        run: |
          TAG="develop"
          echo "image_tag=${TAG}" >> $GITHUB_OUTPUT
          echo "📦 Image tag: ${TAG}"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'
          cache-dependency-path: cmd/pos-backend-web/yarn.lock

      - name: Optimize System Limits for Build
        run: |
          echo "=== Current Limits ==="
          ulimit -n
          echo "=== Setting Higher File Descriptor Limit ==="
          ulimit -n 65536
          echo "New limit: $(ulimit -n)"

      - name: Setup Environment Variables
        run: |
          echo "🔧 設置環境變量..."
          cd cmd/pos-backend-web
          
          # 從 GitHub Secrets 創建 .env 文件
          echo "${{ secrets.DEV_POS_WEB }}" > .env
          
          echo "✅ 環境變量已設置"
          echo "📋 環境變量列表："
          cat .env | grep -v "^#" | grep "=" | cut -d= -f1 | sed 's/^/  - /'

      - name: Build Frontend Application
        env:
          NODE_OPTIONS: "--max-old-space-size=4096 --max-semi-space-size=1024"
        run: |
          echo "🔨 構建前端應用（Vite）..."
          
          cd cmd/pos-backend-web
          
          echo "📦 安裝依賴..."
          yarn install --frozen-lockfile --ignore-engines --network-timeout 300000
          
          echo "🏗️  執行構建..."
          yarn build:production
          
          # 驗證構建產物
          if [ ! -d "dist" ]; then
            echo "❌ 構建失敗：找不到 dist 目錄"
            exit 1
          fi
          
          echo "📊 構建產物大小："
          du -sh dist/
          echo ""
          echo "📂 構建產物內容："
          ls -la dist/
          
          echo "✅ 前端構建完成"

      - name: Build and Push Docker Image
        run: |
          IMAGE_FULL="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          TAG="${{ steps.set-tag.outputs.image_tag }}"
          
          echo "🐳 構建 Docker 鏡像: $IMAGE_FULL:$TAG"
          
          # 在項目根目錄構建（Dockerfile 中的路徑是相對於根目錄的）
          docker build \
            --file ./deploy/pos-backend-web/Dockerfile \
            --tag "$IMAGE_FULL:$TAG" \
            .
          
          echo "📤 推送鏡像..."
          docker push "$IMAGE_FULL:$TAG"
          
          # 顯示鏡像大小
          echo "📊 鏡像大小："
          docker images "$IMAGE_FULL:$TAG" --format "table {{.Repository}}\t{{.Tag}}\t{{.Size}}"
          
          echo "✅ Docker 鏡像構建並推送完成"

  deploy:
    runs-on: mac-mini-build
    needs: build
    if: success()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Kubernetes
        id: deploy
        run: |
          IMAGE_TAG="${{ needs.build.outputs.image_tag }}"
          
          echo "🚀 開始部署 ${{ env.SERVICE_NAME }}..."
          echo "📦 Image tag: ${IMAGE_TAG}"
          echo "📍 Namespace: ${{ env.NAMESPACE }}"
          echo "🌍 Environment: Staging"
          
          # 進入 kustomize overlay 目錄
          cd k8s/overlays/staging
          
          # 更新 image tag
          kustomize edit set image \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${IMAGE_TAG}
          
          # 應用配置
          echo "📦 應用 Kubernetes 配置..."
          kubectl apply -k . || {
            echo "⚠️  部署失敗，可能是 selector 不可變問題"
            echo "🔄 刪除並重新創建 deployment..."
            kubectl delete deployment ${{ env.SERVICE_NAME }} -n ${{ env.NAMESPACE }} --ignore-not-found=true
            kubectl apply -k .
          }
          
          echo "✅ 配置已應用"
          
          # 強制重啟 deployment 以拉取最新的 develop image
          echo "🔄 強制重啟 Deployment（確保使用最新 image）..."
          kubectl rollout restart deployment/${{ env.SERVICE_NAME }} -n ${{ env.NAMESPACE }}
          echo "✅ Deployment 已重啟"

      - name: Wait for deployment
        id: wait
        run: |
          echo "⏳ 等待部署完成（超時 5 分鐘）..."
          
          if kubectl rollout status deployment/${{ env.SERVICE_NAME }} \
            -n ${{ env.NAMESPACE }} \
            --timeout=5m; then
            echo "✅ 部署成功"
            echo "deployment_status=success" >> $GITHUB_OUTPUT
          else
            echo "❌ 部署超時或失敗"
            echo "deployment_status=failed" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Verify deployment
        if: steps.wait.outputs.deployment_status == 'success'
        run: |
          echo "🔍 驗證部署狀態..."
          
          # 獲取 pod 狀態
          kubectl get pods -n ${{ env.NAMESPACE }} -l app=${{ env.SERVICE_NAME }}
          
          # 檢查 pod 是否健康
          READY_PODS=$(kubectl get pods -n ${{ env.NAMESPACE }} \
            -l app=${{ env.SERVICE_NAME }} \
            --field-selector=status.phase=Running \
            -o jsonpath='{.items[*].metadata.name}' | wc -w)
          
          echo "✅ 健康的 Pods 數量: ${READY_PODS}"
          
          if [ "$READY_PODS" -eq 0 ]; then
            echo "❌ 沒有健康的 Pod"
            exit 1
          fi

      - name: Verify SSL Certificate
        if: steps.wait.outputs.deployment_status == 'success'
        run: |
          echo "🔐 驗證 SSL 證書配置..."
          
          DOMAIN="pos-backend-web.passon.tw"
          CERT_NAME="pos-backend-web-tls-staging"
          
          # 等待 DNS 傳播
          echo "⏳ 等待 DNS 傳播（10 秒）..."
          sleep 10
          
          # 1. 檢查 Certificate 資源
          echo ""
          echo "1️⃣ 檢查 Certificate 資源..."
          if kubectl get certificate "$CERT_NAME" -n ${{ env.NAMESPACE }} &>/dev/null; then
            CERT_STATUS=$(kubectl get certificate "$CERT_NAME" -n ${{ env.NAMESPACE }} -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}')
            if [ "$CERT_STATUS" = "True" ]; then
              echo "   ✅ Certificate 狀態: Ready"
            else
              echo "   ❌ Certificate 狀態: $CERT_STATUS"
              exit 1
            fi
          else
            echo "   ❌ Certificate 不存在"
            exit 1
          fi
          
          # 2. 測試 HTTPS 訪問
          echo ""
          echo "2️⃣ 測試 HTTPS 訪問..."
          if CERT_INFO=$(curl -k -v "https://$DOMAIN" 2>&1 | grep -E "(subject:|issuer:)" | head -2); then
            SUBJECT=$(echo "$CERT_INFO" | grep "subject:" | sed 's/.*subject: //')
            ISSUER=$(echo "$CERT_INFO" | grep "issuer:" | sed 's/.*issuer: //')
            
            echo "   📜 證書主體: $SUBJECT"
            echo "   🏢 證書簽發者: $ISSUER"
            
            # 檢查是否是 Let's Encrypt
            if echo "$ISSUER" | grep -q "Let's Encrypt"; then
              echo "   ✅ 使用 Let's Encrypt 生產證書"
            else
              echo "   ❌ 證書簽發者不是 Let's Encrypt: $ISSUER"
              exit 1
            fi
            
            # 檢查域名匹配
            if echo "$SUBJECT" | grep -q "$DOMAIN"; then
              echo "   ✅ 證書域名匹配"
            else
              echo "   ❌ 證書域名不匹配: $SUBJECT"
              exit 1
            fi
          else
            echo "   ❌ 無法連接到服務"
            exit 1
          fi
          
          # 3. 測試健康檢查
          echo ""
          echo "3️⃣ 測試健康檢查..."
          if HEALTH=$(curl -s -f "https://$DOMAIN/health" 2>/dev/null); then
            if [ "$HEALTH" = "healthy" ]; then
              echo "   ✅ 健康檢查通過: $HEALTH"
            else
              echo "   ⚠️  健康檢查回應: $HEALTH"
            fi
          else
            echo "   ⚠️  健康檢查失敗或端點不存在"
          fi
          
          echo ""
          echo "✅ SSL 證書驗證通過！"

      - name: Rollback on failure
        if: failure()
        run: |
          echo "❌ 部署失敗，執行自動回滾..."
          
          # 回滾到上一個版本
          kubectl rollout undo deployment/${{ env.SERVICE_NAME }} \
            -n ${{ env.NAMESPACE }}
          
          echo "⏳ 等待回滾完成..."
          kubectl rollout status deployment/${{ env.SERVICE_NAME }} \
            -n ${{ env.NAMESPACE }} \
            --timeout=3m
          
          echo "✅ 已回滾到上一個版本"
          
          # 顯示當前狀態
          echo ""
          echo "📊 當前部署狀態："
          kubectl get pods -n ${{ env.NAMESPACE }} -l app=${{ env.SERVICE_NAME }}

      - name: Deployment summary
        if: success()
        run: |
          IMAGE_TAG="${{ needs.build.outputs.image_tag }}"
          
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🎉 ${{ env.SERVICE_NAME }} 部署成功"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "📦 Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${IMAGE_TAG}"
          echo "📍 Namespace: ${{ env.NAMESPACE }}"
          echo "🌍 Environment: Staging"
          echo ""
          echo "Pod 狀態："
          kubectl get pods -n ${{ env.NAMESPACE }} -l app=${{ env.SERVICE_NAME }}
          echo ""
          echo "Service 狀態："
          kubectl get svc -n ${{ env.NAMESPACE }} ${{ env.SERVICE_NAME }}
          echo ""
          echo "🌐 訪問地址：https://pos-backend-web.passon.tw"
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

