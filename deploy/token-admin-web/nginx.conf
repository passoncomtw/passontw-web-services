server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip 壓縮
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/xml+rss
        application/json;

    # 安全標頭
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # 靜態資源快取
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API 反向代理 - 轉發到 Kubernetes 內部服務
    # 使用完整的服務 DNS 名稱和正確的端口
    location /api/ {
        # 後端服務: token-admin-api
        # Service 暴露 80 端口，內部轉發到 Pod 的 8080 端口
        proxy_pass http://token-admin-api.passontw-services-staging.svc.cluster.local:80/;
        
        # 代理設置
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # 超時設置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # 緩衝區設置
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # 處理 React Router（SPA 路由）
    location / {
        try_files $uri $uri/ /index.html;
        
        # 不快取 index.html
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;
    }

    # 健康檢查端點
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # 404 處理
    error_page 404 /index.html;

    # 50x 錯誤頁面
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

