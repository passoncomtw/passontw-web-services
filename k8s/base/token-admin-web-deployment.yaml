apiVersion: apps/v1
kind: Deployment
metadata:
  name: token-admin-web
  labels:
    app: token-admin-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: token-admin-web
  template:
    metadata:
      labels:
        app: token-admin-web
    spec:
      containers:
        - name: token-admin-web
          image: ghcr.io/passoncomtw/token-admin-web:placeholder
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      imagePullSecrets:
        - name: ghcr-pull-secret

