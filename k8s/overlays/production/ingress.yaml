apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: token-services-ingress-production
  namespace: passontw-services-production
  annotations:
    # Traefik Ingress Controller
    kubernetes.io/ingress.class: "traefik"
    
    # Cert-manager annotations - 自動申請和更新 Let's Encrypt 證書
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    
    # Traefik 配置 - 強制 HTTPS 重定向
    traefik.ingress.kubernetes.io/redirect-entry-point: https
    traefik.ingress.kubernetes.io/redirect-permanent: "true"
    traefik.ingress.kubernetes.io/frontend-entry-points: http,https
    
    # 啟用 HSTS（HTTP Strict Transport Security）
    traefik.ingress.kubernetes.io/custom-response-headers: |
      Strict-Transport-Security: max-age=31536000; includeSubDomains; preload
      X-Frame-Options: SAMEORIGIN
      X-Content-Type-Options: nosniff
      X-XSS-Protection: 1; mode=block
spec:
  # TLS 配置
  tls:
  - hosts:
    - admin.passon.tw
    secretName: token-admin-web-prod-tls  # cert-manager 會自動創建此 Secret
  
  # 路由規則
  rules:
  - host: admin.passon.tw
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: token-admin-web
            port:
              number: 80

