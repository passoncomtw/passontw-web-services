apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# 引用基礎配置
resources:
  - ../../base
  - ingress.yaml

# Production 命名空間
namespace: passontw-services-production

# 鏡像標籤（由 CI/CD 動態設置）
images:
  - name: ghcr.io/passoncomtw/token-admin-web
    newTag: main-PLACEHOLDER  # 將被 CI/CD 替換

# Production 環境的資源配置
patches:
  # 副本數 - Production 使用更多副本以提供高可用性
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
    target:
      kind: Deployment
      name: token-admin-web
  
  # Resource limits - Production 使用更高的資源配額
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi
    target:
      kind: Deployment
      name: token-admin-web

