apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pos-backend-web-ingress-staging
  namespace: passontw-services-staging
  annotations:
    # Traefik Ingress Controller
    kubernetes.io/ingress.class: "traefik"
    
    # Cert-Manager 自動管理 SSL 證書
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    
    # Traefik - 強制 HTTPS 重定向
    traefik.ingress.kubernetes.io/redirect-entry-point: https
    traefik.ingress.kubernetes.io/redirect-permanent: "true"
    traefik.ingress.kubernetes.io/frontend-entry-points: http,https
    
    # 安全標頭 - HSTS, XSS Protection, etc.
    traefik.ingress.kubernetes.io/custom-response-headers: |
      Strict-Transport-Security: max-age=31536000; includeSubDomains; preload
      X-Frame-Options: SAMEORIGIN
      X-Content-Type-Options: nosniff
      X-XSS-Protection: 1; mode=block
    
spec:
  tls:
  - hosts:
    - pos-backend-web.passon.tw
    secretName: pos-backend-web-tls-staging
  
  rules:
  - host: pos-backend-web.passon.tw
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: pos-backend-web
            port:
              number: 80

