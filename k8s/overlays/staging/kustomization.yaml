apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# 引用基礎配置
resources:
  - ../../base
  - ingress.yaml  # Web 前端 Ingress（包含 HTTPS/TLS）

# Staging 命名空間
namespace: passontw-services-staging

# 鏡像標籤（由 CI/CD 動態設置）
images:
  - name: ghcr.io/passoncomtw/token-admin-web
    newTag: develop-PLACEHOLDER  # 將被 CI/CD 替換

# Staging 環境的資源配置
patches:
  # 副本數
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
    target:
      kind: Deployment
      name: token-admin-web

