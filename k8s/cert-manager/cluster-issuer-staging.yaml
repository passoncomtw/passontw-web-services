apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    # Let's Encrypt Staging 環境伺服器（用於測試，避免速率限制）
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    
    # 用於接收證書到期通知的郵件地址
    email: passon.com.tw@gmail.com
    
    # 用於存儲 ACME 帳戶私鑰的 Secret 名稱
    privateKeySecretRef:
      name: letsencrypt-staging
    
    # 使用 HTTP-01 challenge 驗證域名所有權
    solvers:
    - http01:
        ingress:
          class: traefik
